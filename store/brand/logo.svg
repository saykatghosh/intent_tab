<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Intent Tab logo (source). A browser tab with a focus point inside:
       "a tab, opened on purpose". The PNGs in /icons are rendered from this
       file (icon16.png from logo-16.svg). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a7bff"/>
      <stop offset=".5" stop-color="#5546e8"/>
      <stop offset="1" stop-color="#2b2390"/>
    </linearGradient>
    <radialGradient id="mint" cx=".95" cy="1" r=".75">
      <stop offset="0" stop-color="#3ff0c8" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#3ff0c8" stop-opacity=".25"/>
      <stop offset="1" stop-color="#3ff0c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" cx="0" cy="0" r=".6">
      <stop offset="0" stop-color="#ff9ad5" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff9ad5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e6ff"/>
    </linearGradient>
    <linearGradient id="focus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fd9b4"/>
      <stop offset="1" stop-color="#6a4dff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#160f5c" flood-opacity=".45"/>
    </filter>
    <clipPath id="clip"><rect x="4" y="4" width="120" height="120" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="4" y="4" width="120" height="120" fill="url(#bg)"/>
    <rect x="4" y="4" width="120" height="120" fill="url(#pink)"/>
    <rect x="4" y="4" width="120" height="120" fill="url(#mint)"/>
    <rect x="4" y="4" width="120" height="64" fill="url(#sheen)"/>
    <!-- the tab strip line the tab sits on -->
    <rect x="4" y="94" width="120" height="3" fill="#ffffff" opacity=".22"/>
  </g>

  <!-- the browser tab, flared at the bottom like a real tab -->
  <path filter="url(#shadow)" fill="url(#tab)"
        d="M14 96 C22 96 27 92 27 84 L27 50 Q27 35 42 35 L86 35 Q101 35 101 50 L101 84 C101 92 106 96 114 96 Z"/>

  <!-- the focus point: why this tab is open -->
  <circle cx="64" cy="66" r="15" fill="none" stroke="url(#focus)" stroke-width="5.5"/>
  <circle cx="64" cy="66" r="6" fill="url(#focus)"/>

  <rect x="4.5" y="4.5" width="119" height="119" rx="29.5" fill="none" stroke="#ffffff" stroke-opacity=".18"/>
</svg>
