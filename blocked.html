<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus</title>
  <link rel="stylesheet" href="css/newtab.css">
  <script src="js/theme-boot.js"></script>
</head>
<body class="blocked-page">
  <main class="blocked">
    <div class="blocked-orb" aria-hidden="true"></div>
    <p class="eyebrow" id="bSite"></p>
    <h1 class="question" id="bTitle"></h1>
    <p class="blocked-intent"><span id="bLabel"></span> <strong id="bIntent"></strong></p>
    <p class="muted" id="bLeft"></p>
    <div class="intent-actions">
      <button type="button" class="btn btn-primary" id="bBack"></button>
      <button type="button" class="btn btn-quiet" id="bAllow"></button>
    </div>
    <p class="muted small" id="bNote"></p>
  </main>
  <script type="module" src="blocked.js"></script>
</body>
</html>
