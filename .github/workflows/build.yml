name: Check & build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Validates manifest, JS syntax, imports, element ids and en/bn strings, then zips.
      - name: Check and build the extension
        run: node scripts/build.mjs

      - name: Upload the ZIP
        uses: actions/upload-artifact@v4
        with:
          name: intent-tab
          path: dist/*.zip
          if-no-files-found: error
